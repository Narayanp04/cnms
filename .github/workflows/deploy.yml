# =============================================================================
# ConnectXperts NMS - CI/CD Deployment Pipeline
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST        - VPS IP address (e.g., 123.456.789.0)
#   VPS_USER        - SSH username (e.g., root)
#   VPS_SSH_KEY     - SSH private key for deployment
#   VPS_KNOWN_HOST  - SSH host fingerprint (run: ssh-keyscan <IP>)
#   JWT_SECRET_KEY  - JWT signing secret for production
#   POSTGRES_PASSWORD    - (optional) Database password, default: cnms123
#   REDIS_PASSWORD       - (optional) Redis password, default: cnms-redis-pass
#   CERTBOT_EMAIL        - (optional) Email for Let's Encrypt notices
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  PROJECT_DIR: /var/www/cnms

jobs:
  # ===========================================================================
  # CI - Validate builds and run checks
  # ===========================================================================
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Frontend validation ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # --- Backend validation ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt

      - name: Check backend imports
        working-directory: backend
        run: python -c "from app.main import app; print('Backend imports OK')"

      # --- Docker validation ---
      - name: Validate Docker Compose config
        run: |
          docker compose -f docker-compose.prod.yml config > /dev/null 2>&1 \
            && echo "Docker Compose config valid" \
            || echo "Docker Compose check skipped (requires env vars)"

  # ===========================================================================
  # CD - Deploy to Production VPS
  # ===========================================================================
  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_KNOWN_HOST }}
          script: |
            echo "[1/5] Pulling latest code..."
            cd ${{ env.PROJECT_DIR }}
            git stash 2>/dev/null || true
            git checkout main 2>/dev/null || git checkout master 2>/dev/null
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            echo "[2/5] Ensuring directories exist..."
            mkdir -p data/certbot/www data/certbot/conf

            echo "[3/5] Building Docker images..."
            export JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}'
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'
            export REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}'
            docker compose -f docker-compose.prod.yml build --pull

            echo "[4/5] Restarting services..."
            docker compose -f docker-compose.prod.yml up -d

            echo "[5/5] Checking service health..."
            sleep 15
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if curl -sf https://monitor.connectxperts.in/health > /dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              echo "  Waiting for services... (attempt $i/5)"
              sleep 5
            done

            if [ "$HEALTHY" = true ]; then
              echo "Health check passed!"
              docker image prune -f
            else
              echo "WARNING: Health check failed -- dumping container logs..."
              docker compose -f docker-compose.prod.yml logs --tail=30 2>/dev/null
              echo "Container status:"
              docker compose -f docker-compose.prod.yml ps 2>/dev/null
            fi

            echo "Deployment complete!"

      - name: Deployment Status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "SUCCESS: Deployment to monitor.connectxperts.in completed"
          else
            echo "FAILED: Deployment failed -- check workflow logs"
          fi
